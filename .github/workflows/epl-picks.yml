name: EPL picks
# Copies ProbaLab's EPL picks into data/epl-picks.json every 30 minutes (and on demand).
# Picks refresh until kick-off, then freeze. No odds or prices. The site team grades results.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: epl-picks
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch picks
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --max-time 30 https://zwdpsereqicvzbtfrrnd.supabase.co/functions/v1/epl-picks-feed -o /tmp/epl-picks.json
          # only accept a non-empty array of picks with the expected fields
          jq -e 'type == "array" and length > 0 and all(.[]; has("game_id") and has("round") and has("p_home") and has("p_draw") and has("p_away") and .status == "pre")' /tmp/epl-picks.json > /dev/null
          mkdir -p data
          jq . /tmp/epl-picks.json > data/epl-picks.json
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/epl-picks.json && git ls-files --error-unmatch data/epl-picks.json >/dev/null 2>&1; then
            echo "No change"; exit 0
          fi
          git config user.name "probalab-bot"
          git config user.email "probalab-bot@users.noreply.github.com"
          git add data/epl-picks.json
          git commit -m "EPL picks update"
          git pull --rebase
          git push

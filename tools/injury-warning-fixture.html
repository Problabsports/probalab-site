<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Injury warning fixture · ProbaLab</title>
<link rel="stylesheet" href="/page.css">
<style>
  body { margin: 0; background: #07080f; color: var(--ink, #e8ecff); font-family: var(--f-body, system-ui); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
  .card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; position: relative; padding: 14px; border: 1px solid var(--line-hi, #2a3150); border-radius: 12px; background: #0d1020; }
  .tipster-pop-title { margin: 0 0 6px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 12px; }
  .tipster-pop-body { margin: 0; font-size: 14px; line-height: 1.45; }
</style>
</head>
<body>
<main class="wrap">
  <h1>Injury warning fixture</h1>
  <p>Local fixture for the ⚠️ badge. Feed fields: <code>injury_warning: true</code>, <code>injury_note</code> as shown. Tap or hover the badge.</p>
  <div class="card-top" id="demo">
    <span class="time">Mon 11:30am</span>
    <span class="chip ORANGE">Orange</span>
    <button type="button" class="injury-warn-btn" data-injury-note="Barnes, Quickley and Murray-Boyles are uncertain (GTD)." aria-expanded="false" aria-label="Injury warning" title="Injury warning">⚠️</button>
    <span class="p">TOR 63%</span>
  </div>
  <p class="small" style="margin-top:16px;color:#8b93b3">MEM @ TOR · light stays Orange · badge only appears when injury_warning is true.</p>
</main>
<script src="/injury-warning.js"></script>
<script>
  // Auto-open once so screenshots can capture the popover without a click race.
  requestAnimationFrame(() => {
    const btn = document.querySelector(".injury-warn-btn");
    if (btn) btn.click();
  });
</script>
</body>
</html>
